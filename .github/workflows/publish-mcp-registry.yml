name: Publish MCP Registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v0.8.1
        required: true
        type: string
      metadata_ref:
        description: Optional ref containing repaired registry metadata
        required: false
        type: string

permissions: {}

concurrency:
  group: mcp-registry-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.metadata_ref || inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      - name: Validate release metadata
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          SERVER_VERSION="$(node -p 'require("./server.json").version')"
          if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" || "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          if [[ "$SERVER_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "server.json version $SERVER_VERSION does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install verified MCP publisher
        run: |
          ARCHIVE=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${ARCHIVE}" \
            --output "$ARCHIVE"
          echo "${MCP_PUBLISHER_SHA256}  ${ARCHIVE}" | sha256sum --check
          tar -xzf "$ARCHIVE" mcp-publisher
          ./mcp-publisher validate server.json

      - name: Check whether this version is already published
        id: registry
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          STATUS="$(curl --silent --show-error \
            --output registry.json \
            --write-out '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.subsquid-labs%2Fportal-mcp-server/versions/${VERSION}")"
          if [[ "$STATUS" == "200" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "$STATUS" == "404" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Registry returned HTTP $STATUS" >&2
            cat registry.json >&2
            exit 1
          fi

      - name: Authenticate with GitHub OIDC
        if: steps.registry.outputs.exists != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata
        if: steps.registry.outputs.exists != 'true'
        run: ./mcp-publisher publish server.json

      - name: Verify published version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.subsquid-labs%2Fportal-mcp-server/versions/${VERSION}" \
              | jq -e --arg version "$VERSION" \
                'select(.server.name == "io.github.subsquid-labs/portal-mcp-server" and .server.version == $version and ._meta["io.modelcontextprotocol.registry/official"].isLatest == true)' \
                >/dev/null; then
              echo "Official MCP Registry now serves $VERSION as latest"
              exit 0
            fi
            echo "Waiting for registry propagation ($attempt/12)"
            sleep 5
          done
          echo "Official MCP Registry did not expose $VERSION as latest" >&2
          exit 1
