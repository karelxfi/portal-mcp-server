name: Publish MCP Registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v0.8.1
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: mcp-registry-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate release metadata
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          SERVER_VERSION="$(node -p 'require("./server.json").version')"
          if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" || "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          if [[ "$SERVER_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "server.json version $SERVER_VERSION does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install verified MCP publisher
        run: |
          ARCHIVE=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${ARCHIVE}" \
            --output "$ARCHIVE"
          echo "${MCP_PUBLISHER_SHA256}  ${ARCHIVE}" | sha256sum --check
          tar -xzf "$ARCHIVE" mcp-publisher
          ./mcp-publisher validate server.json

      - name: Check whether this version is already published
        id: registry
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          curl --fail --silent --show-error \
            'https://registry.modelcontextprotocol.io/v0.1/servers?search=subsquid' \
            --output registry.json
          if jq -e --arg version "$VERSION" \
            '.servers[] | select(.server.name == "io.github.subsquid-labs/portal-mcp-server" and .server.version == $version)' \
            registry.json >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with GitHub OIDC
        if: steps.registry.outputs.exists != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata
        if: steps.registry.outputs.exists != 'true'
        run: ./mcp-publisher publish server.json

      - name: Verify published version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              'https://registry.modelcontextprotocol.io/v0.1/servers?search=subsquid' \
              | jq -e --arg version "$VERSION" \
                '.servers[] | select(.server.name == "io.github.subsquid-labs/portal-mcp-server" and .server.version == $version and ._meta["io.modelcontextprotocol.registry/official"].isLatest == true)' \
                >/dev/null; then
              echo "Official MCP Registry now serves $VERSION as latest"
              exit 0
            fi
            echo "Waiting for registry propagation ($attempt/12)"
            sleep 5
          done
          echo "Official MCP Registry did not expose $VERSION as latest" >&2
          exit 1
