name: Verify Docker Image Builds

# The publishing workflow only runs on a default-branch push or a v* tag, so
# a broken image was previously discovered after the tag was already public.
# This job builds the same image on every pull request and never pushes it.
on:
  pull_request:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build the image without publishing it
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=pr-verify
          cache-to: type=gha,mode=max,scope=pr-verify
