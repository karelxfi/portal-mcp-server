name: GitHub Release

# A v* tag creates the GitHub release from the matching CHANGELOG.md
# section, then packages and uploads the Gemini extension archive. Re-running
# on an existing tag is a no-op for the release and refreshes the asset.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release or repair, for example v0.8.5
        required: true
        type: string

permissions: {}

concurrency:
  group: github-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      - name: Validate release metadata
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          SERVER_VERSION="$(node -p 'require("./server.json").version')"
          if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" || "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          if [[ "$SERVER_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "server.json version $SERVER_VERSION does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          node scripts/extract-changelog-section.mjs "$VERSION" > release-notes.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged"
          else
            gh release create "$RELEASE_TAG" \
              --title "SQD Portal MCP v$VERSION" \
              --notes-file release-notes.md \
              --verify-tag
          fi

  gemini:
    needs: release
    uses: ./.github/workflows/publish-gemini-extension.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.release.outputs.tag }}
