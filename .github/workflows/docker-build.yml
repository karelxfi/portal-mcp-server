name: Build Docker Image

# Tag semantics: a default-branch push publishes edge and sha-<commit>; a
# v* tag publishes latest, X.Y.Z, X.Y, and sha-<commit>. latest therefore
# always means the latest tagged release. Release images do not share a
# layer cache with edge builds.
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    # The Explorer layout baseline is recorded in this image and measures text
    # boxes to the pixel. Measuring it on a bare runner made every text box
    # about 10% wider and failed a release tag on fonts rather than on markup,
    # which is why the CI offline job already runs here. The tag is held
    # against the locked playwright version by npm run test:workflow-pins.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The image ships the matching Chromium already, so there is nothing to
      # install or cache here.

      # A main push publishes an edge image from a green offline gate; a
      # release tag must pass the full matrix including the live suites.
      - name: Run offline gate
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run test:offline

      - name: Run full test gate
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: npm run test:ci

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Docker login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Record build time
        id: buildinfo
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: subsquid/portal-mcp-server
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.buildinfo.outputs.time }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.buildinfo.outputs.time }}
          cache-from: ${{ startsWith(github.ref, 'refs/tags/') && '' || 'type=gha,scope=edge' }}
          cache-to: ${{ startsWith(github.ref, 'refs/tags/') && '' || 'type=gha,mode=max,scope=edge' }}
