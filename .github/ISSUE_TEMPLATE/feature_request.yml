name: Feature request
description: A question the server cannot answer yet, or a tool, network, or client it should support
labels: [enhancement]
body:
  - type: textarea
    id: question
    attributes:
      label: The question you want answered
      description: Phrase it the way you would ask an assistant, with the network and the time window.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: Which tools you tried and where they fell short.
  - type: textarea
    id: evidence
    attributes:
      label: Where the data lives
      description: A Portal dataset, table, or public source that holds the answer, if you know it.
